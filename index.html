<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACAF Personal V2.2</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:1100px;margin:0 auto;padding:24px;background:#f6f7f9;color:#17202a}
.card{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:14px 0}
button{padding:10px 16px;border:0;border-radius:9px;cursor:pointer}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin:6px 0 12px;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef2ff}
.hidden{display:none}
.small{color:#68707a;font-size:.9rem}
</style>
</head>
<body>
<h1>ACAF Personal</h1>
<div id="status" class="small">Connecting…</div>

<section id="auth" class="card">
<h2>Login / Bejelentkezés</h2>
<div class="row">
<div><label>Email</label><input id="email" type="email"></div>
<div><label>Password</label><input id="password" type="password"></div>
</div>
<button onclick="signIn()">Sign in</button>
<button onclick="signUp()">Create account</button>
<p id="authMsg" class="small"></p>
</section>

<section id="app" class="hidden">
<div class="card">
<h2>Dashboard</h2>
<p><span class="badge">Online Supabase connected</span></p>
<button onclick="signOut()">Sign out</button>
</div>

<div class="card">
<h2>New Audit / Új audit</h2>
<label>Organisation / Szervezet</label><input id="org" placeholder="MALÉV Aero Club ATO">
<div class="row">
<div><label>Audit name / Audit neve</label><input id="auditName" placeholder="ATO Compliance Audit"></div>
<div><label>Framework</label><input id="framework" value="Part-ORA / Part-FCL"></div>
</div>
<label>Scope / Hatókör</label><textarea id="scope"></textarea>
<button onclick="createAudit()">Create audit</button>
<p id="auditMsg" class="small"></p>
</div>

<div class="card">
<h2>My audits</h2>
<div id="audits">Loading…</div>
</div>
</section>

<script>
const SUPABASE_URL = "https://ajxktmacnkieqayiogxa.supabase.co";
const SUPABASE_KEY = "sb_publishable_yqGYD_c_WanfAjiPhuj60Q_o9sGSqlp";
let session = null;

async function api(path, opts={}) {
  const headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + (session?.access_token || SUPABASE_KEY),
    "Content-Type":"application/json"
  }, opts.headers||{});
  const r = await fetch(SUPABASE_URL + path, {...opts, headers});
  const text = await r.text();
  let data; try { data = text ? JSON.parse(text) : null; } catch { data=text; }
  if(!r.ok) throw new Error(typeof data==="string"?data:(data?.message||JSON.stringify(data)));
  return data;
}

async function signIn(){
  try{
    const email=document.getElementById("email").value, password=document.getElementById("password").value;
    const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    });
    const d=await r.json(); if(!r.ok) throw new Error(d.msg||d.message||"Login failed");
    session=d; localStorage.setItem("acaf_session",JSON.stringify(d)); showApp(); loadAudits();
  }catch(e){document.getElementById("authMsg").textContent=e.message}
}
async function signUp(){
  try{
    const email=document.getElementById("email").value, password=document.getElementById("password").value;
    const r=await fetch(SUPABASE_URL+"/auth/v1/signup",{
      method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    });
    const d=await r.json(); if(!r.ok) throw new Error(d.msg||d.message||"Signup failed");
    document.getElementById("authMsg").textContent="Account created. Check your email if confirmation is enabled.";
  }catch(e){document.getElementById("authMsg").textContent=e.message}
}
function signOut(){session=null;localStorage.removeItem("acaf_session");document.getElementById("app").classList.add("hidden");document.getElementById("auth").classList.remove("hidden");}
function showApp(){document.getElementById("auth").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("status").textContent="Connected to Supabase";}
async function createAudit(){
  try{
    const name=document.getElementById("auditName").value, framework=document.getElementById("framework").value, scope=document.getElementById("scope").value;
    const orgName=document.getElementById("org").value || "My Organisation";
    // Create organisation first; RLS will ensure ownership if schema supports it.
    const orgs=await api("/rest/v1/organisations?select=id&name=eq."+encodeURIComponent(orgName)+"&limit=1");
    let orgId=orgs?.[0]?.id;
    if(!orgId){
      const created=await api("/rest/v1/organisations",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({name:orgName})});
      orgId=created[0].id;
    }
    const created=await api("/rest/v1/audits",{method:"POST",headers:{"Prefer":"return=representation"},body:JSON.stringify({organisation_id:orgId,name,framework,scope,status:"draft"})});
    document.getElementById("auditMsg").textContent="Audit created: "+created[0].id;
    loadAudits();
  }catch(e){document.getElementById("auditMsg").textContent=e.message}
}
async function loadAudits(){
  try{
    const rows=await api("/rest/v1/audits?select=*&order=created_at.desc");
    document.getElementById("audits").innerHTML=rows.length?rows.map(x=>`<div class="card"><b>${escapeHtml(x.name||"Audit")}</b><br><span class="small">${escapeHtml(x.framework||"")} · ${escapeHtml(x.status||"")}</span><br><span class="small">${x.id}</span></div>`).join(""):"No audits yet.";
  }catch(e){document.getElementById("audits").textContent=e.message}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]));}
(function(){
  const saved=localStorage.getItem("acaf_session");
  if(saved){try{session=JSON.parse(saved);showApp();loadAudits()}catch{}}
})();
</script>
</body>
</html>
